name: Mac build

# Builds BrickLess on a GitHub-hosted Mac (macos-latest). Free for public
# repos, so no runner install and no Mac setup is needed. Restricted to
# pushes to main and manual runs only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build (simulator)
        id: build
        run: |
          set -o pipefail
          xcodebuild -project BrickLess.xcodeproj -scheme BrickLess -destination 'generic/platform=iOS Simulator' build 2>&1 | tee build.log

      - name: Write build report
        if: always()
        run: |
          {
            echo "# BrickLess build report"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Build: ${{ steps.build.outcome }}"
            echo
            echo "## Build log (tail)"
            echo '```'
            tail -40 build.log 2>/dev/null || echo "(no build log)"
            echo '```'
          } > build-report.md

      - name: Commit report
        if: always()
        run: |
          git config user.name "brickless-ci"
          git config user.email "brickless-ci@users.noreply.github.com"
          git add build-report.md
          git diff --cached --quiet || git commit -m "Build report for ${GITHUB_SHA:0:7}" && git push
