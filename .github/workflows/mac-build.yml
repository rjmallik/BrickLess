name: Mac build

# Builds BrickLess on a GitHub-hosted Mac (macos-latest). Free for public
# repos, so no runner install and no Mac setup is needed. Restricted to
# pushes to main and manual runs only.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs: two pushes close together used to race, and the first run's
# build-report push got rejected (non-fast-forward) even though its build
# passed. Queued runs wait their turn instead.
concurrency:
  group: mac-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build (simulator)
        id: build
        run: |
          set -o pipefail
          xcodebuild -project BrickLess.xcodeproj -scheme BrickLess -destination 'generic/platform=iOS Simulator' build 2>&1 | tee build.log

      - name: Test (simulator)
        id: test
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          xcodebuild test -project BrickLess.xcodeproj -scheme BrickLess -destination 'platform=iOS Simulator,name=iPhone 17' 2>&1 | tee test.log

      - name: Write build report
        if: always()
        run: |
          {
            echo "# BrickLess build report"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Build: ${{ steps.build.outcome }}"
            echo "- Tests: ${{ steps.test.outcome }}"
            echo
            echo "## Build log (tail)"
            echo '```'
            tail -40 build.log 2>/dev/null || echo "(no build log)"
            echo '```'
            echo
            echo "## Test log (tail)"
            echo '```'
            tail -40 test.log 2>/dev/null || echo "(no test log)"
            echo '```'
          } > build-report.md

      # The log tails above almost never contain the actual error: the
      # failing Swift file compiles long before the tail, so the report
      # says "BUILD FAILED at EmitSwiftModule" with no error text.
      # This step greps the full logs for the error lines and appends
      # them to the report, so the next failure names the file, line
      # and message instead of just the failing build command.
      - name: Error lines
        if: always()
        run: |
          {
            echo
            echo "## Build errors"
            echo '```'
            if [ -f build.log ]; then
              grep "error:" build.log | head -100 || true
            else
              echo "(no build log)"
            fi
            echo '```'
            echo
            echo "## Test errors"
            echo '```'
            if [ -f test.log ]; then
              grep -E "error:|Test Case .* failed" test.log | head -100 || true
            else
              echo "(no test log)"
            fi
            echo '```'
          } >> build-report.md

      - name: Commit report
        if: always()
        run: |
          git config user.name "brickless-ci"
          git config user.email "brickless-ci@users.noreply.github.com"
          git add build-report.md
          git diff --cached --quiet && exit 0
          git commit -m "Build report for ${GITHUB_SHA:0:7}"
          # If a newer commit landed on main while this run was building,
          # skip the report: the newer run will publish its own, and pushing
          # from an old checkout would be rejected (non-fast-forward).
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Main has moved on to a newer commit; skipping this report."
            exit 0
          fi
          git push origin HEAD:main || echo "Report push raced with a newer run; skipping."
